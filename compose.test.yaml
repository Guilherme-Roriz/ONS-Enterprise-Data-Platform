name: ons-data-platform-test

services:
  test-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: test_admin_password
      POSTGRES_DB: ons_edp_test
      DB_USER: etl_test
      DB_PASSWORD: test_etl_password
      OLTP_USER: oltp_test
      OLTP_PASSWORD: test_oltp_password
    ports:
      - "${TEST_POSTGRES_PORT:-55432}:5432"
    volumes:
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
      - ./DDL:/ddl:ro
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ons_edp_test"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s
    networks:
      - ons-test-network
    restart: "no"

networks:
  ons-test-network:
    name: ons-test-network
    driver: bridge

