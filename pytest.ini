[pytest]
minversion = 8.0
testpaths = tests
addopts = -ra --strict-markers --strict-config
markers =
    unit: fast tests without external services
    integration: tests against the isolated PostgreSQL test database
    data_quality: cross-table and cross-layer data quality assertions
    e2e: complete empty-database pipeline and rerun validation
    orchestration: real Airflow scheduler and DockerOperator validation
    failure_path: expected failure, rollback, and recovery behavior
