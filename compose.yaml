name: ons-data-platform

x-python-service: &python-service
  build:
    context: .
    dockerfile: Dockerfile
  image: ons-etl:local
  networks:
    - ons-network
  restart: "no"

x-etl-environment: &etl-environment
  DB_HOST: ${DOCKER_DB_HOST:-postgres}
  DB_PORT: "5432"
  DB_NAME: ${DB_NAME:-ons_edp}
  DB_USER: ${DB_USER:-etl_user}
  DB_PASSWORD: "${DB_PASSWORD:?Set DB_PASSWORD in .env}"
  GALAXY_START_DATE: ${GALAXY_START_DATE:-2000-01-01}
  GALAXY_END_DATE: ${GALAXY_END_DATE:-2050-12-31}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}

x-airflow-environment: &airflow-environment
  AIRFLOW__CORE__EXECUTOR: LocalExecutor
  AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: "postgresql+psycopg2://${AIRFLOW_DB_USER:-airflow}:${AIRFLOW_DB_PASSWORD:?Set AIRFLOW_DB_PASSWORD in .env}@airflow-db:5432/${AIRFLOW_DB_NAME:-airflow}"
  AIRFLOW__CORE__FERNET_KEY: "${AIRFLOW_FERNET_KEY:?Set AIRFLOW_FERNET_KEY in .env}"
  AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
  AIRFLOW__CORE__LOAD_EXAMPLES: "false"
  AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-api-server:8080/execution/
  AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_USERS: ${AIRFLOW_USERS:-admin:admin}
  AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_PASSWORDS_FILE: /opt/airflow/auth/passwords.json
  AIRFLOW__API_AUTH__JWT_SECRET: "${AIRFLOW_API_JWT_SECRET:?Set AIRFLOW_API_JWT_SECRET in .env}"
  AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: "true"
  AIRFLOW__DAG_PROCESSOR__HEALTH_CHECK_THRESHOLD: "90"
  PYTHONPATH: /opt/airflow/project

x-airflow-common: &airflow-common
  build:
    context: .
    dockerfile: Dockerfile.airflow
    args:
      AIRFLOW_VERSION: ${AIRFLOW_VERSION:-3.3.1}
      PYTHON_VERSION: ${AIRFLOW_PYTHON_VERSION:-3.13}
  image: ons-airflow:${AIRFLOW_VERSION:-3.3.1}
  environment: *airflow-environment
  user: "${AIRFLOW_UID:-50000}:0"
  volumes:
    - airflow-logs:/opt/airflow/logs
  networks:
    - ons-network
  restart: unless-stopped

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_ADMIN_USER:-postgres}
      POSTGRES_PASSWORD: "${POSTGRES_ADMIN_PASSWORD:?Set POSTGRES_ADMIN_PASSWORD in .env}"
      POSTGRES_DB: ${DB_NAME:-ons_edp}
      DB_USER: ${DB_USER:-etl_user}
      DB_PASSWORD: "${DB_PASSWORD:?Set DB_PASSWORD in .env}"
      OLTP_USER: ${OLTP_USER:-oltp_loader}
      OLTP_PASSWORD: "${OLTP_PASSWORD:?Set OLTP_PASSWORD in .env}"
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
      - ./DDL:/ddl:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - ons-network
    restart: unless-stopped
    shm_size: "128mb"

  seed-oltp:
    <<: *python-service
    profiles: ["manual"]
    command: ["python", "DDL/populate.py"]
    environment:
      DB_HOST: ${DOCKER_DB_HOST:-postgres}
      DB_PORT: "5432"
      DB_NAME: ${DB_NAME:-ons_edp}
      DB_USER: ${OLTP_USER:-oltp_loader}
      DB_PASSWORD: "${OLTP_PASSWORD:?Set OLTP_PASSWORD in .env}"
    depends_on:
      postgres:
        condition: service_healthy

  oltp-to-vault:
    <<: *python-service
    profiles: ["manual"]
    command: ["python", "-m", "ETL.data_vault.main"]
    environment: *etl-environment
    volumes:
      - etl-logs:/app/ETL/logs
    depends_on:
      postgres:
        condition: service_healthy
      seed-oltp:
        condition: service_completed_successfully

  vault-to-galaxy:
    <<: *python-service
    profiles: ["manual"]
    command: ["python", "-m", "ETL.galaxy.main"]
    environment: *etl-environment
    volumes:
      - etl-logs:/app/ETL/logs
    depends_on:
      postgres:
        condition: service_healthy
      oltp-to-vault:
        condition: service_completed_successfully

  airflow-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${AIRFLOW_DB_USER:-airflow}
      POSTGRES_PASSWORD: "${AIRFLOW_DB_PASSWORD:?Set AIRFLOW_DB_PASSWORD in .env}"
      POSTGRES_DB: ${AIRFLOW_DB_NAME:-airflow}
    volumes:
      - airflow-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - ons-network
    restart: unless-stopped

  airflow-init:
    <<: *airflow-common
    command: ["db", "migrate"]
    depends_on:
      airflow-db:
        condition: service_healthy
    restart: "no"

  airflow-api-server:
    <<: *airflow-common
    command: ["api-server"]
    ports:
      - "${AIRFLOW_PORT:-8080}:8080"
    volumes:
      - airflow-logs:/opt/airflow/logs
      - airflow-auth:/opt/airflow/auth
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/api/v2/monitor/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    depends_on:
      airflow-db:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow-common
    command: ["scheduler"]
    environment:
      <<: *airflow-environment
      DB_HOST: ${DOCKER_DB_HOST:-postgres}
      DB_PORT: "5432"
      DB_NAME: ${DB_NAME:-ons_edp}
      ETL_DB_USER: ${DB_USER:-etl_user}
      ETL_DB_PASSWORD: "${DB_PASSWORD:?Set DB_PASSWORD in .env}"
      OLTP_DB_USER: ${OLTP_USER:-oltp_loader}
      OLTP_DB_PASSWORD: "${OLTP_PASSWORD:?Set OLTP_PASSWORD in .env}"
      GALAXY_START_DATE: ${GALAXY_START_DATE:-2000-01-01}
      GALAXY_END_DATE: ${GALAXY_END_DATE:-2050-12-31}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    healthcheck:
      test: ["CMD-SHELL", "airflow jobs check --job-type SchedulerJob --hostname \"$${HOSTNAME}\""]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
      airflow-db:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully

  airflow-dag-processor:
    <<: *airflow-common
    command: ["dag-processor"]
    healthcheck:
      test: ["CMD-SHELL", "airflow jobs check --job-type DagProcessorJob --hostname \"$${HOSTNAME}\""]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    depends_on:
      airflow-db:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully

networks:
  ons-network:
    driver: bridge

volumes:
  postgres-data:
  etl-logs:
  airflow-db-data:
  airflow-logs:
  airflow-auth:
